const scene=new THREE.Scene();scene.background=new THREE.Color(0x7775aa);scene.fog=new THREE.FogExp2(0x8882b9,.026);

scene.add(new THREE.HemisphereLight(0xe5e9ff,0x343557,2.6));function light(x,y,z,c,p){let l=new THREE.PointLight(c,p,30);l.position.set(x,y,z);scene.add(l)}light(-5,8,4,0xa8c9ff,100);light(5,6,-5,0xd2b6ff,120);light(0,3,9,0x63c9ff,45);
const mat=(c,m=.3,r=.3)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});const white=mat(0xf4f7ff,.55,.19),dark=mat(0x111c35,.4,.17),black=mat(0x050b18,.55,.17),trim=mat(0x202b49,.8,.23),chrome=mat(0xb8c9e5,.85,.18);const blue=new THREE.MeshBasicMaterial({color:0x34dfff}),red=new THREE.MeshBasicMaterial({color:0xff355e});const ship=new THREE.Group();scene.add(ship);
function mesh(geo,material,parent=ship,x=0,y=0,z=0){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);parent.add(o);return o}function box(w,h,d,m,x,y,z){return mesh(new THREE.BoxGeometry(w,h,d),m,ship,x,y,z)}function ell(w,h,d,m,x,y,z){let o=mesh(new THREE.SphereGeometry(1,40,24),m,ship,x,y,z);o.scale.set(w,h,d);return o}function line(points,material,r=.025,parent=ship){let curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));return mesh(new THREE.TubeGeometry(curve,Math.max(16,points.length*10),r,8,false),material,parent)}
// Forward direction is -Z; rear thrusters are at +Z.
const body=ell(2.22,.55,4.1,white,0,1.5,0);box(3.55,.44,6.4,white,0,1.52,0);ell(2.05,.38,2.8,white,0,1.65,-1.2);ell(2.13,.48,1.85,white,0,1.57,2.2);
// Smooth side curvature and wide shoulders, no side thrusters or door handles.

// Capsule canopy with seamless wraparound glazing.
ell(1.67,.83,2.75,dark,0,2.18,-.15);ell(1.58,.68,2.56,black,0,2.30,-.22);line([[-1.25,2.18,-2.12],[-1.48,2.35,-.6],[-1.27,2.30,1.55],[0,2.12,2.25],[1.27,2.30,1.55],[1.48,2.35,-.6],[1.25,2.18,-2.12]],blue,.017);
// Front recognizable Honda grille and signature.
box(2.35,.37,.09,black,0,1.55,-4.03);box(1.65,.10,.12,chrome,0,1.52,-4.12);box(.38,.30,.13,chrome,0,1.68,-4.18);box(.17,.21,.14,black,0,1.68,-4.26);for(const s of [-1,1]){let lamp=box(.94,.09,.12,blue,s*1.28,1.85,-3.87);lamp.rotation.y=s*.23;box(.75,.055,.08,blue,s*1.18,1.10,-3.79)}
// Rear continuous red signature.
box(3.52,.08,.12,red,0,1.85,3.73);box(.36,.24,.12,chrome,0,1.91,3.81);
// Small fins above rear body.
for(const s of [-1,1]){let f=box(.55,.13,1.05,white,s*1.42,2.53,2.32);f.rotation.z=s*.35;f.rotation.x=-.18}
// Underbody light and floor reflection.
const glow=new THREE.MeshBasicMaterial({color:0x29cfff,transparent:true,opacity:.18,depthWrite:false});ell(2.15,.10,3.45,glow,0,.99,.05);
// Thruster ring assemblies and animated axial beam cones at the BACK ONLY.
const engines=[];for(const s of [-1,1]){const unit=new THREE.Group();unit.position.set(s*1.32,1.46,3.72);ship.add(unit);let casing=mesh(new THREE.CylinderGeometry(.62,.67,1.10,48),trim,unit,0,0,.38);casing.rotation.x=Math.PI/2;let cavity=mesh(new THREE.CircleGeometry(.50,48),black,unit,0,0,1.00);let ring=mesh(new THREE.TorusGeometry(.47,.10,14,64),blue,unit,0,0,1.03);let inner=mesh(new THREE.TorusGeometry(.27,.025,10,48),chrome,unit,0,0,1.04);let core=mesh(new THREE.CircleGeometry(.18,32),blue,unit,0,0,1.07);let beamMat=new THREE.MeshBasicMaterial({color:0x28dfff,transparent:true,opacity:.45,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});let beam=mesh(new THREE.ConeGeometry(.41,4.8,32,1,true),beamMat,unit,0,0,3.48);beam.rotation.x=Math.PI/2;let streaks=[];for(let i=0;i<15;i++){let b=mesh(new THREE.SphereGeometry(.025,6,6),new THREE.MeshBasicMaterial({color:i%3===0?0xffffff:0x50dfff,transparent:true,opacity:.8}),unit);streaks.push(b)}engines.push({unit,ring,beam,beamMat,streaks})}
// Ground and luminous studio halo.
const floor=mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x64618e,metalness:.48,roughness:.27}),scene,0,-.12,0);floor.rotation.x=-Math.PI/2;const disk=mesh(new THREE.CircleGeometry(5.6,96),new THREE.MeshBasicMaterial({color:0x343b86,transparent:true,opacity:.18,depthWrite:false}),scene,0,-.105,0);disk.rotation.x=-Math.PI/2;const circle=mesh(new THREE.TorusGeometry(6.6,.065,12,128),new THREE.MeshBasicMaterial({color:0xb8a5ff}),scene,0,8,0);circle.rotation.x=Math.PI/2;for(let i=0;i<6;i++){const a=i*Math.PI/3;light(Math.cos(a)*8,1,Math.sin(a)*8,0x6c7eff,12)}
let speed=35,targetSpeed=35,space=true,auto=true,boost=false,angle=.65,elevation=.23,dist=14,last=performance.now(),elapsed=0,drag=false,px=0,py=0,touches=new Map(),pinch=0;const slider=document.getElementById('speed');slider.oninput=()=>{targetSpeed=+slider.value;boost=false;document.getElementById('boost').classList.remove('active')};function toggle(id,on){document.getElementById(id).classList.toggle('active',on)}document.getElementById('auto').onclick=()=>{auto=!auto;toggle('auto',auto)};document.getElementById('transform').onclick=()=>{space=!space;toggle('transform',space);document.getElementById('transform').textContent=space?'SPACE MODE':'ROAD PREVIEW'};document.getElementById('boost').onclick=()=>{boost=!boost;targetSpeed=boost?100:35;slider.value=targetSpeed;toggle('boost',boost)};
const cvs=renderer.domElement;cvs.addEventListener('pointerdown',e=>{drag=true;auto=false;toggle('auto',false);px=e.clientX;py=e.clientY;cvs.setPointerCapture(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY])});cvs.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===2){const p=[...touches.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pinch)dist=THREE.MathUtils.clamp(dist*pinch/d,7,25);pinch=d}else if(drag){angle-=(e.clientX-px)*.008;elevation=THREE.MathUtils.clamp(elevation+(e.clientY-py)*.006,-.06,.95)}px=e.clientX;py=e.clientY});function up(e){touches.delete(e.pointerId);drag=touches.size>0;pinch=0}cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',up);cvs.addEventListener('wheel',e=>{dist=THREE.MathUtils.clamp(dist+e.deltaY*.01,7,25)},{passive:true});
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;speed+=(targetSpeed-speed)*Math.min(1,dt*2.6);const power=speed/100;document.getElementById('speedNum').textContent=Math.round(speed);document.getElementById('engineText').textContent=speed>88?'HYPERDRIVE':speed>55?'ACCELERATING':speed>0?'CRUISE':'STANDBY';document.getElementById('status').textContent=space?'● FLIGHT MODE':'● ROAD PREVIEW';if(auto)angle+=dt*(.11+power*.07);camera.position.set(Math.sin(angle)*dist*Math.cos(elevation),3.0+dist*Math.sin(elevation),Math.cos(angle)*dist*Math.cos(elevation));camera.lookAt(0,1.7,0);ship.position.y=(space?.27:0)+Math.sin(elapsed*(1.2+power*2))*(space?.065:0);ship.rotation.z=space?Math.sin(elapsed*.65)*.015:0;ship.rotation.x=space?Math.sin(elapsed*.42)*.012:0;for(const en of engines){en.unit.visible=space;en.beam.visible=space&&speed>2;en.beam.scale.setScalar(1);en.beam.scale.y=.14+power*1.5+Math.sin(elapsed*24)*.035;en.beamMat.opacity=.13+power*.45;en.ring.scale.setScalar(1+power*.09+Math.sin(elapsed*14)*.02);en.streaks.forEach((b,i)=>{let phase=(elapsed*(1+power*11)+i*.49)%6;b.position.set(Math.sin(i*2.4)*(.1+phase*.08),Math.cos(i*2.4)*(.1+phase*.08),1.1+phase*(.3+power));b.scale.setScalar(.45+power*1.7);b.visible=power>.07})}renderer.render(scene,camera)}requestAnimationFrame(frame);window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
