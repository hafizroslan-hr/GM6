<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141632"><title>Honda City GM6 | Approved Sport Explorer</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#12142c;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#6d6ba9 0,#36385f 47%,#111329 100%)}header{position:absolute;top:0;left:0;right:0;z-index:2;padding:calc(env(safe-area-inset-top) + 18px) 20px 10px;background:linear-gradient(#10122aaa,transparent)}h1{font-size:17px;letter-spacing:.13em;margin:0}small{color:#80ddff;letter-spacing:.12em}.viewer{position:absolute;inset:95px 0 240px;display:grid;place-items:center;touch-action:pan-y}.viewer img{width:100%;max-height:100%;object-fit:contain;user-select:none;pointer-events:none;filter:drop-shadow(0 22px 28px #0006)}.stage{width:min(100%,1000px);position:relative}.stage img{width:100%;display:block}.label{position:absolute;bottom:10px;left:18px;color:#c4f6ff;background:#13182bb9;border:1px solid #8bceff55;padding:8px 12px;border-radius:10px;font-size:12px}.hud{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:16px;border-radius:18px;background:#0e1631e9;border:1px solid #80cbff55;backdrop-filter:blur(18px)}.buttons{display:flex;gap:8px;margin:12px 0}.buttons button{flex:1;background:#23345c;color:#fff;border:1px solid #6086bc88;padding:12px 6px;border-radius:10px;font-weight:700;font-size:12px}.buttons button.active{background:#0d8bb5}.range{width:100%;accent-color:#60e4ff}.status{display:flex;justify-content:space-between;font-size:13px}.status b{color:#70e8ff}.note{font-size:11px;color:#c0c6dd;margin-top:8px;text-align:center}.thruster{position:absolute;bottom:30%;right:8%;width:18%;height:16%;border-radius:50%;background:radial-gradient(ellipse,#53d9ff66,transparent 70%);filter:blur(14px);opacity:0;pointer-events:none;mix-blend-mode:screen}.glow .thruster{opacity:.8;animation:pulse .28s infinite alternate}@keyframes pulse{to{opacity:.35;transform:scale(1.3)}}@media(min-width:700px){.viewer{inset:85px 0 205px}.hud{max-width:600px;left:50%;transform:translateX(-50%)}} </style></head><body><div class="bg"></div><header><h1>HONDA CITY GM6</h1><small>SPORT EXPLORER · APPROVED DESIGN</small></header><main class="viewer" id="viewer"><div class="stage" id="stage"><img id="view" src="angle-2.jpg" alt="Approved Honda City GM6 Sport Explorer render"><div class="thruster"></div><span class="label" id="label">FRONT THREE-QUARTER · 02 / 05</span></div></main><div class="hud"><div class="status"><span>VIEW ANGLE <b id="count">02 / 05</b></span><span>THRUST <b id="percent">35%</b></span></div><input id="slider" class="range" aria-label="View angle" type="range" min="0" max="4" value="1" step="1"><div class="buttons"><button id="prev">◀ ROTATE</button><button id="auto">AUTO ROTATE</button><button id="boost">BOOST</button><button id="next">ROTATE ▶</button></div><div class="note">Swipe to browse the five actual approved render angles · Not a fabricated 3D mesh</div></div><script>const frames=['angle-1.jpg','angle-2.jpg','angle-3.jpg','angle-4.jpg','angle-5.jpg'],names=['FRONT','FRONT THREE-QUARTER','SIDE PROFILE','REAR THREE-QUARTER','REAR'];let index=1,playing=false,timer=null,boost=false;const v=document.getElementById('view'),slider=document.getElementById('slider'),stage=document.getElementById('stage');function show(n){index=(n+5)%5;v.src=frames[index];slider.value=index;document.getElementById('label').textContent=names[index]+' · '+String(index+1).padStart(2,'0')+' / 05';document.getElementById('count').textContent=String(index+1).padStart(2,'0')+' / 05'}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);slider.oninput=e=>show(+e.target.value);document.getElementById('auto').onclick=e=>{playing=!playing;e.target.classList.toggle('active',playing);clearInterval(timer);if(playing)timer=setInterval(()=>show(index+1),950)};document.getElementById('boost').onclick=e=>{boost=!boost;stage.classList.toggle('glow',boost);e.target.classList.toggle('active',boost);document.getElementById('percent').textContent=boost?'100%':'35%'};let x=null;document.getElementById('viewer').addEventListener('touchstart',e=>{x=e.touches[0].clientX},{passive:true});document.getElementById('viewer').addEventListener('touchend',e=>{if(x!==null){let dx=e.changedTouches[0].clientX-x;if(Math.abs(dx)>25)show(index+(dx<0?1:-1));x=null}},{passive:true});let down=null;document.getElementById('viewer').addEventListener('pointerdown',e=>down=e.clientX);document.getElementById('viewer').addEventListener('pointerup',e=>{if(down!==null&&Math.abs(e.clientX-down)>30)show(index+(e.clientX<down?1:-1));down=null});</script></body></html>
